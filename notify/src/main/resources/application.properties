spring.application.name=ms-barriodigital-notify
server.port=${SERVER_PORT:8087}
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:barriodigital}
spring.rabbitmq.connection-timeout=5s
# Infra owns exchanges, queues, bindings and DLX policies. Never redeclare them here.
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.retry.enabled=false

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

barriodigital.notify.storage-directory=${NOTIFY_STORAGE_DIR:./data}
barriodigital.notify.mail-from=${SMTP_FROM:no-reply@barriodigital.test}
barriodigital.notify.max-attempts=${NOTIFY_MAX_ATTEMPTS:3}
barriodigital.notify.retry-delay-ms=${NOTIFY_RETRY_DELAY_MS:1000}
barriodigital.notify.listeners-auto-startup=${NOTIFY_LISTENERS_AUTO_STARTUP:true}
