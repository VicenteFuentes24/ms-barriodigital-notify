name: barriodigital-notify
services:
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    restart: unless-stopped
    networks: [barriodigital-net]
  notify:
    profiles: [app]
    build: .
    environment:
      SERVER_PORT: 8087
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:-barriodigital}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-no-reply@barriodigital.test}
      NOTIFY_STORAGE_DIR: /app/data
      NOTIFY_MAX_ATTEMPTS: ${NOTIFY_MAX_ATTEMPTS:-3}
      NOTIFY_RETRY_DELAY_MS: ${NOTIFY_RETRY_DELAY_MS:-1000}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8087}:8087"
    volumes:
      - notify-data:/app/data
    depends_on: [mailpit]
    restart: unless-stopped
    networks: [barriodigital-net]
volumes:
  mailpit-data:
  notify-data:
networks:
  barriodigital-net:
    external: true
    name: ${BARRIODIGITAL_NETWORK_NAME:-infra-barriodigital_barriodigital-net}
